name: Bug report
description: Something went wrong at the table or in the Buddy window.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If this is a security problem (for example Buddy seeing your hidden hand), please don't post it here. See [SECURITY.md](https://github.com/Hill-To-Die-On/TTS-Buddy/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did Buddy or the table do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can I make it happen?
      description: The steps from loading the save, including the score and whose turn it was if you know.
      placeholder: |
        1. Loaded Signal Run in a fresh save slot and sat at White
        2. Started Buddy and clicked New match
        3. Played a Jam when the score was 5-6
        4. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TTS Buddy version
      description: The `version` in package.json, the ZIP name or the commit you're on.
      placeholder: 0.1.2
    validations:
      required: true
  - type: dropdown
    id: opponent
    attributes:
      label: Which Buddy were you playing?
      options:
        - Local model (Ollama)
        - Local model (LM Studio)
        - Local model (Unsloth Studio)
        - Baseline (--baseline)
        - Not sure
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model shown in the Buddy window, if any.
      placeholder: qwen3:4b-instruct-2507-q4_K_M
  - type: input
    id: environment
    attributes:
      label: Windows and Tabletop Simulator versions
      placeholder: Windows 11 24H2, TTS 14.2.2
  - type: textarea
    id: logs
    attributes:
      label: Buddy window output
      description: Paste the text from the Buddy window. Please remove any API keys first.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the relevant lines from `tts-buddy-history.jsonl` or anything else that helps.
